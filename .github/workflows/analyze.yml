name: analyze-dex
on:
  workflow_dispatch:

jobs:
  dex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          java -version
          curl -sSL -o baksmali.jar https://github.com/baksmali/smali/releases/download/v2.5.2/baksmali-2.5.2.jar
          ls -l baksmali.jar

      - name: Disassemble classes7
        run: |
          java -jar baksmali.jar d analysis/classes7.dex -o out7
          echo "=== smali count ==="
          find out7 -name "*.smali" | wc -l
          echo "=== top of tree ==="
          find out7 -name "*.smali" | sort | head -120
          echo "=== verdict toast refs ==="
          grep -rl "Toast" out7 | head -30
          echo "=== killProcess refs ==="
          grep -rl "killProcess" out7 | head -30
          echo "=== app info probes ==="
          grep -rl "getApplicationInfo" out7 | head -30
          echo "=== datadir probes ==="
          grep -rl "getDataDir\|getFilesDir\|getExternalFilesDir\|getObbDir" out7 | head -30
          echo "=== proc probes ==="
          grep -rl "/proc/" out7 | head -30
          echo "=== qnxUk1 tree ==="
          find out7/qnxUk1 -name "*.smali" | sort | head -200
          echo "=== verdict classes ==="
          for f in $(find out7/qnxUk1 -name "*.smali" | sort); do
            echo "### $f"
            grep -nE "^\.class|^\.super|Toast|Virtualized|Detected|killProcess|getApplicationInfo|getPackageInfo|getDataDir|getuid|/proc/|native " "$f" | head -40
          done
          zip -qr appdome-smali.zip out7/qnxUk1

      - uses: actions/upload-artifact@v4
        with:
          name: appdome-smali
          path: appdome-smali.zip
