                      "            } finally { r.close(); }\n"
                      "        } catch (Throwable ignored) { }\n"
                      "        return false;\n"
                      "    }\n"
                      "\n"
                      "    private static File flagFile(String name) {\n"
                      "        try {\n"
                      "            File root = Environment.getExternalStoragePublicDirectory(\n"
