name: build-container

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream (BlackBox fork, modern NDK/AGP)
        run: |
          git clone --depth 1 https://github.com/JDKaintscared/BlackBox.git src
          cd src && git log -1 --oneline

      - name: Apply hardening + logging
        run: |
          cp hardening/harden.cpp src/Bcore/src/main/cpp/harden.cpp
          cp hardening/OfxLog.kt src/app/src/main/java/top/niunaijun/blackboxa/app/OfxLog.kt
          python3 - <<'PY'
          import sys, pathlib

          # --- native hooks into the Bcore module -------------------------
          mk = pathlib.Path("src/Bcore/src/main/cpp/Android.mk")
          s = mk.read_text()
          if "harden.cpp" not in s:
              old = "LOCAL_SRC_FILES := BoxCore.cpp \\"
              if old not in s:
                  sys.exit("Android.mk: anchor not found")
              s = s.replace(old, "LOCAL_SRC_FILES := BoxCore.cpp \\\n    harden.cpp \\")
              mk.write_text(s)

          bc = pathlib.Path("src/Bcore/src/main/cpp/BoxCore.cpp")
          s = bc.read_text()
          if "ofx_install_hardening" not in s:
              anchor = "void registerMethod(JNIEnv *jenv) {"
              if anchor not in s:
                  sys.exit("BoxCore.cpp: anchor not found")
              s = s.replace(anchor, 'extern "C" void ofx_install_hardening();\n\n' + anchor)
              call = "    registerMethod(env);\n    return JNI_VERSION_1_6;"
              if call not in s:
                  sys.exit("BoxCore.cpp: JNI_OnLoad anchor not found")
              s = s.replace(call, "    registerMethod(env);\n    ofx_install_hardening();\n    return JNI_VERSION_1_6;")
              bc.write_text(s)

          # --- boot logging ----------------------------------------------
          app = pathlib.Path("src/app/src/main/java/top/niunaijun/blackboxa/app/App.kt")
          s = app.read_text()
          if "OfxLog.install" not in s:
              anchor = "            super.attachBaseContext(base)"
              if anchor not in s:
                  sys.exit("App.kt: attachBaseContext anchor not found")
              s = s.replace(anchor, anchor + "\n            OfxLog.install(this)", 1)
              app.write_text(s)

          wc = pathlib.Path("src/app/src/main/java/top/niunaijun/blackboxa/view/main/WelcomeActivity.kt")
          s = wc.read_text()
          if "OfxLog" not in s:
              if "import android.os.Bundle" not in s:
                  sys.exit("WelcomeActivity: import anchor not found")
              s = s.replace("import android.os.Bundle",
                            "import android.os.Bundle\nimport top.niunaijun.blackboxa.app.OfxLog", 1)
              anchor = "        super.onCreate(savedInstanceState)"
              if anchor not in s:
                  sys.exit("WelcomeActivity: onCreate anchor not found")
              s = s.replace(anchor, anchor + '\n        OfxLog.log("WelcomeActivity.onCreate")', 1)
              wc.write_text(s)

          print("patched ok:",
                "harden.cpp" in mk.read_text(),
                "ofx_install_hardening" in bc.read_text(),
                "OfxLog.install" in app.read_text(),
                "OfxLog" in wc.read_text())
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          yes | "$SM" --install "ndk;29.0.13846066" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          echo "sdk.dir=$SDK" >> src/local.properties
          echo "ndk.dir=$SDK/ndk/29.0.13846066" >> src/local.properties

      - name: Build
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-apk
          path: src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
